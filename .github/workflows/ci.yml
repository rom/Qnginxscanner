name: ci

on:
  push:
    branches: [rom]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check (gofmt, vet, tests)
        run: make check
      - name: Coverage gate
        run: make cover-check
